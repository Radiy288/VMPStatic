name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -o VMPStatic.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: VMPStatic.exe
